<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP DEMO Portal</title>
<style>
:root {
  --sap-blue: #0070F2;
  --sap-blue-dark: #0050B8;
  --sap-blue-light: #4CB1FF;
  --sap-blue-pale: #E1F4FF;
  --bg: #F2F4F7;
  --white: #FFFFFF;
  --border: #E1E2E6;
  --text: #1D2D3E;
  --text-muted: #556B82;
  --tag-bg: #E1F4FF;
  --green: #107E3E;
  --green-bg: #EAF5EA;
  --orange: #C14646;
  --orange-bg: #FCEAEA;
  --purple: #5C23C9;
  --purple-bg: #F0ECFF;
  --amber: #E96B09;
  --amber-bg: #FFF3E8;
  --header-h: 56px;
  --subnav-h: 50px;
  --radius: 12px;
  --shadow: 0 1px 6px rgba(0,0,0,.07);
  --shadow-hover: 0 6px 24px rgba(0,112,242,.14);
  --transition: .18s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"72","72 Brand",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:200;
  height:var(--header-h);background:var(--sap-blue);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.header-left{display:flex;align-items:center;gap:14px}
.logo-wrap{display:flex;align-items:center;height:30px}
.logo-wrap svg{height:28px;width:auto}
.hdiv{width:1px;height:20px;background:rgba(255,255,255,.35)}
.header-title{font-size:17px;font-weight:600;color:#fff;letter-spacing:.2px}

/* Search */
.search-wrap{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);
  border-radius:24px;padding:7px 16px;min-width:260px;
  transition:background var(--transition);
}
.search-wrap:focus-within{background:rgba(255,255,255,.22)}
.search-wrap svg{flex-shrink:0;opacity:.8}
.search-wrap input{
  background:transparent;border:none;outline:none;
  color:#fff;font-size:14px;width:100%;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.65)}

/* ── TAB NAV ── */
.tab-nav{
  position:sticky;top:var(--header-h);z-index:190;
  background:var(--white);border-bottom:2px solid var(--border);
  padding:0 28px;display:flex;gap:2px;overflow-x:auto;
}
.tab-nav::-webkit-scrollbar{height:0}
.tab-btn{
  padding:15px 18px;background:none;border:none;border-bottom:3px solid transparent;
  cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);
  white-space:nowrap;margin-bottom:-2px;transition:all var(--transition);
}
.tab-btn:hover{color:var(--sap-blue)}
.tab-btn.active{color:var(--sap-blue);border-bottom-color:var(--sap-blue);font-weight:700}

/* ── SUB FILTER BAR (SAC) ── */
.subfilter-bar{
  background:var(--white);padding:10px 28px;border-bottom:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;
}
.subfilter-bar.hidden{display:none}
.chip{
  padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--white);cursor:pointer;font-size:13px;font-weight:500;
  color:var(--text-muted);transition:all var(--transition);
}
.chip:hover{border-color:var(--sap-blue);color:var(--sap-blue)}
.chip.active{background:var(--sap-blue);border-color:var(--sap-blue);color:#fff}

/* ── MAIN ── */
.main{padding:24px 28px;max-width:1440px;margin:0 auto}

/* stats row */
.stats-row{
  display:flex;gap:20px;flex-wrap:wrap;
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 22px;margin-bottom:24px;
}
.stat{display:flex;flex-direction:column;gap:2px;min-width:80px}
.stat-val{font-size:26px;font-weight:700;color:var(--sap-blue);line-height:1}
.stat-lbl{font-size:12px;color:var(--text-muted);margin-top:2px}
.vdivider{width:1px;background:var(--border);align-self:stretch}

/* section */
.section{margin-bottom:36px}
.section-head{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.sec-icon{
  width:34px;height:34px;border-radius:8px;background:var(--sap-blue);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:17px;flex-shrink:0;
}
.sec-titles{display:flex;flex-direction:column;gap:1px}
.sec-title{font-size:16px;font-weight:700}
.sec-sub{font-size:12px;color:var(--text-muted)}
.sec-line{flex:1;height:1px;background:var(--border)}
.sec-count{
  font-size:12px;font-weight:600;color:var(--sap-blue);
  background:var(--sap-blue-pale);border-radius:20px;padding:2px 10px;
}

/* grid */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
}

/* ── DEMO CARD ── */
.card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
  cursor:pointer;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:10px;
  transition:all var(--transition);position:relative;overflow:hidden;
}
.card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--sap-blue);transform:scaleX(0);transform-origin:left;
  transition:transform .2s ease;
}
.card:hover{
  box-shadow:var(--shadow-hover);
  border-color:var(--sap-blue-light);
  transform:translateY(-2px);
}
.card:hover::after{transform:scaleX(1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.card-icon-box{
  width:38px;height:38px;border-radius:8px;
  background:var(--sap-blue-pale);display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;
}
.badge{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;
  background:var(--tag-bg);color:var(--sap-blue);white-space:nowrap;
}
.badge.g{background:var(--green-bg);color:var(--green)}
.badge.o{background:var(--amber-bg);color:var(--amber)}
.badge.r{background:var(--orange-bg);color:var(--orange)}
.badge.p{background:var(--purple-bg);color:var(--purple)}

.card-title{font-size:14px;font-weight:700;line-height:1.4;color:var(--text)}
.card-zh{font-size:12px;color:var(--sap-blue);font-weight:500;margin-top:-4px}
.card-desc{font-size:12.5px;color:var(--text-muted);line-height:1.55;flex:1}

.card-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:4px;border-top:1px solid var(--border);padding-top:10px;
}
.launch-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--sap-blue);color:#fff;
  padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;
  text-decoration:none;transition:background var(--transition);
  pointer-events:none;
}
.card:hover .launch-btn{background:var(--sap-blue-dark)}
.card-region{font-size:11px;color:var(--text-muted)}

/* placeholder */
.placeholder{
  background:var(--white);border:2px dashed var(--border);
  border-radius:var(--radius);padding:20px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:8px;
  min-height:160px;cursor:default;
}
.placeholder .ph-icon{
  width:38px;height:38px;border-radius:50%;
  background:var(--bg);border:1.5px dashed var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#b0b8c8;
}
.placeholder strong{font-size:13px;color:var(--text-muted)}
.placeholder p{font-size:12px;color:#aab4c0;max-width:180px;line-height:1.4}

/* no-result */
.no-result{
  grid-column:1/-1;text-align:center;padding:48px 0;color:var(--text-muted);
}
.no-result svg{margin-bottom:12px;opacity:.3}
.no-result p{font-size:15px}

/* hidden */
.hidden{display:none!important}

/* FOOTER */
.footer{
  background:var(--text);color:rgba(255,255,255,.55);
  text-align:center;padding:18px;font-size:12px;margin-top:32px;
}
.footer a{color:var(--sap-blue-light);text-decoration:none}

/* responsive */
@media(max-width:720px){
  .header{padding:0 14px}
  .tab-nav,.subfilter-bar,.main{padding-left:14px;padding-right:14px}
  .search-wrap{min-width:160px}
  .stats-row .vdivider:nth-child(n+4){display:none}
}
</style>
</head>

let activeSub = "all";

];

/* ════ RENDER ════ */
function render() {
  const portal = document.getElementById("portal");
  portal.innerHTML = "";
  let totalVisible = 0;

  SECTIONS.forEach(sec => {
    // Tab filter
    if (activeTab !== "all") {
      if (activeTab === "sac" && sec.cat !== "sac") return;
      if (activeTab !== "sac" && sec.cat !== activeTab) return;
    }
    // SAC sub filter
    if (activeTab === "sac" && activeSub !== "all" && sec.sub !== activeSub) return;

    // Filter demos for this section
    const demos = DEMOS.filter(d => {
      const matchCat = d.cat === sec.cat && (sec.sub === null || d.sub === sec.sub);
      if (!matchCat) return false;
      if (!searchQ) return true;
      const q = searchQ.toLowerCase();
      return d.title.toLowerCase().includes(q) ||
             d.zh.toLowerCase().includes(q) ||
             d.desc.toLowerCase().includes(q) ||
             d.tags.some(t => t.toLowerCase().includes(q));
    });

    const hasPH = PLACEHOLDERS[sec.key] && activeTab !== "all" && !searchQ;
    if (demos.length === 0 && !hasPH) return;

    totalVisible += demos.length;
    portal.appendChild(buildSection(sec, demos, hasPH));
  });

  document.getElementById("visibleCount").textContent = totalVisible;

  // "No results" message
  if (portal.innerHTML === "" || (portal.querySelectorAll(".card").length === 0 && !portal.querySelector(".placeholder"))) {
    portal.innerHTML = `
      <div class="no-result">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.4">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <p>找不到符合「${searchQ}」的 Demo 資源</p>
      </div>`;
    document.getElementById("visibleCount").textContent = "0";
  }
}

function buildSection(sec, demos, showPlaceholder) {
  const wrap = document.createElement("section");
  wrap.className = "section";
  wrap.innerHTML = `
    <div class="section-head">
      <div class="sec-icon">${sec.icon}</div>
      <div class="sec-titles">
        <div class="sec-title">${sec.title}</div>
        <div class="sec-sub">${sec.eng}</div>
      </div>
      <div class="sec-line"></div>
      <div class="sec-count">${demos.length} 個 Demo</div>
    </div>
    <div class="card-grid" id="grid-${sec.key}"></div>`;

  const grid = wrap.querySelector(".card-grid");
  demos.forEach(d => grid.appendChild(buildCard(d)));
  if (showPlaceholder && PLACEHOLDERS[sec.key]) {
    grid.appendChild(buildPlaceholder(PLACEHOLDERS[sec.key]));
  }
  return wrap;
}

function buildCard(d) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = d.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = d.title;
  a.innerHTML = `
    <div class="card-top">
      <div class="card-icon-box">${d.icon}</div>
      <span class="badge ${d.badgeCls}">${d.badge}</span>
    </div>
    <div class="card-title">${d.title}</div>
    <div class="card-zh">${d.zh}</div>
    <div class="card-desc">${d.desc}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px">
      ${d.tags.slice(0,4).map(t=>`<span style="font-size:11px;background:#F0F4F8;color:#556B82;padding:2px 7px;border-radius:10px">${t}</span>`).join("")}
    </div>
    <div class="card-footer">
      <span class="launch-btn">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
          <path d="M3 13L13 3M13 3H7M13 3V9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        開啟 Demo
      </span>
      <span class="card-region">${d.region}</span>
    </div>`;
  return a;
}

function buildPlaceholder(ph) {
  const div = document.createElement("div");
  div.className = "placeholder";
  div.innerHTML = `
    <div class="ph-icon">＋</div>
    <strong>${ph.title}</strong>
    <p>${ph.hint}</p>`;
  return div;
}

/* ── Tab / Sub Switch ── */
function switchTab(tab, el) {
  activeTab = tab;
  activeSub = "all";
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  // Show/hide sub filter
  const bar = document.getElementById("subfilterBar");
  if (tab === "sac") { bar.classList.remove("hidden"); }
  else               { bar.classList.add("hidden"); }
  // Reset sub chips
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  document.querySelector(".chip[data-sub='all']").classList.add("active");
  render();
}

function switchSub(sub, el) {
  activeSub = sub;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  render();
}

/* ── Search ── */
function onSearch() {
  searchQ = document.getElementById("searchInput").value.trim();
  render();
}

/* ── Keyboard shortcut ── */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "k") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
});

/* ── Initial render ── */
render();
</script>
</body>
</html>
